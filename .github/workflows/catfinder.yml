name: Catfinder täglich

on:
  schedule:
    - cron: "30 10 * * *"  # 12:30 Uhr CEST (Sommerzeit) / 11:30 Uhr CET (Winterzeit)
  workflow_dispatch:       # Manuell auslösbar

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Catfinder ausführen
        id: catfinder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python catfinder.py --no-browser

      - name: Report für GitHub Pages vorbereiten
        run: |
          mkdir -p docs
          cp reports/report.html docs/index.html

      - name: State committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen_cats.json docs/index.html
          git diff --cached --quiet || git commit -m "chore: state & report aktualisiert [skip ci]"
          git push

      - name: Push-Benachrichtigung senden
        if: steps.catfinder.outputs.new_count > 0
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NEW_COUNT: ${{ steps.catfinder.outputs.new_count }}
        run: |
          curl -fsS \
            -H "Title: ${NEW_COUNT} neue Katze(n)" \
            -H "Priority: high" \
            -H "Tags: cat" \
            -H "Click: https://aleks-muc.github.io/catfinder/" \
            -d "Neue Treffer im Tierschutzverein München – tippen zum Report." \
            "https://ntfy.sh/${NTFY_TOPIC}"

      - name: Fehler-Benachrichtigung senden
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS \
            -H "Title: Catfinder-Lauf fehlgeschlagen" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Der geplante Lauf ist fehlgeschlagen — Listing-Layout, API oder Netz prüfen." \
            "https://ntfy.sh/${NTFY_TOPIC}"
